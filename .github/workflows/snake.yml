name: Atualizar cobrinha de contribuiçõees

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preparar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Gerar animações clara e escura
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0891b2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2dd4bf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar animações na branch output
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/github-snake.svg
          test -s dist/github-snake-dark.svg
          cp dist/github-snake*.svg "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin output > /dev/null; then
            git fetch origin output
            git switch -c output --track origin/output
          else
            git switch --orphan output
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP"/github-snake*.svg .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'As animações já estão atualizadas.'
          else
            git commit -m 'chore: atualizar animação de contribuições'
            git push origin HEAD:output
          fi
